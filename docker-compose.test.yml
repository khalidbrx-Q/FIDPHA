# =============================================================================
# WinInPharma — local test runner with Postgres + Redis sidecars
# =============================================================================
# Mirrors the GitHub Actions CI environment (.github/workflows/ci.yml):
# same Postgres 16 / Redis 7 images, same Django env vars, same Python+
# Playwright versions. Running the suite here gives the same green/red
# outcome as CI without having to push to a branch.
#
# Quick start:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
#
# What that does:
#   1. Builds the `tests` image from Dockerfile.test (cached after first run).
#   2. Starts postgres + redis containers, waits for both to be healthy.
#   3. Runs the full test suite inside the `tests` container.
#   4. `--abort-on-container-exit` shuts everything down when pytest returns.
#
# Scope to a subset:
#   docker compose -f docker-compose.test.yml run --rm tests pytest tests-suite/unit/
#   docker compose -f docker-compose.test.yml run --rm tests pytest tests-suite/e2e/
#   docker compose -f docker-compose.test.yml run --rm tests pytest tests-suite/e2e/test_portal.py
#
# Clean up after a run:
#   docker compose -f docker-compose.test.yml down -v
# =============================================================================

services:

  # ─── Postgres 16 ────────────────────────────────────────────────────────
  # pytest-django creates `test_<NAME>` on demand, so the empty `postgres`
  # default DB is enough — the LOCAL_DB_NAME on the tests service is only
  # used as the base for the test-DB name.
  postgres:
    image: postgres:16-alpine
    container_name: wininpharma-test-postgres
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       postgres
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout:  3s
      retries:  10

  # ─── Redis 7 ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wininpharma-test-redis
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  10

  # ─── Test runner ────────────────────────────────────────────────────────
  # Builds from Dockerfile.test. The bind-mount on /app means code edits on
  # the host show up inside the container without a rebuild — handy when
  # iterating on a failing test.
  tests:
    build:
      context:    .
      dockerfile: Dockerfile.test
    container_name: wininpharma-test-runner
    # Bind-mount the project so test edits don't require a rebuild.
    # The `/app/staticfiles` and Python caches are anonymous volumes so the
    # host doesn't get polluted with container-only artefacts.
    volumes:
      - .:/app
      - /app/staticfiles
      - /app/.pytest_cache
      - /app/__pycache__
    environment:
      # ─── Django config (must mirror the CI env block) ──────────────────
      CI:               "True"
      SECRET_KEY:       "test-secret-not-used-in-prod"
      DEBUG:            "False"
      ALLOWED_HOSTS:    "*"
      DJANGO_SETTINGS_MODULE: "FIDPHA001.settings"

      # ─── DB: connect to the postgres sidecar by service name ───────────
      DB_BACKEND:        "local"
      LOCAL_DB_NAME:     "wininpharma_test"
      LOCAL_DB_USER:     "postgres"
      LOCAL_DB_PASSWORD: "postgres"
      LOCAL_DB_HOST:     "postgres"
      LOCAL_DB_PORT:     "5432"

      # ─── Redis: connect to the redis sidecar by service name ───────────
      REDIS_URL:         "redis://redis:6379"

      # ─── Sentry: empty DSN disables it ─────────────────────────────────
      SENTRY_DSN:        ""

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Wait for migrations of staticfiles before pytest, mirroring CI's
    # collectstatic step (WhiteNoise's manifest storage 500s without it).
    command: >-
      sh -c "python manage.py collectstatic --noinput --clear &&
             pytest tests-suite/ -v --tb=short"
