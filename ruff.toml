# Ruff configuration for the WinInPharma Django repo.
# See https://docs.astral.sh/ruff/configuration/ for the full schema.

target-version = "py312"
line-length = 120

# Folders ruff should never look at.
exclude = [
    ".venv",
    "frontend",            # React app — has its own JS toolchain
    "**/migrations",       # auto-generated by Django; never edited by hand
    "staticfiles",         # collectstatic output
    "*.html",              # Django templates aren't Python
]

[lint]
# Default rule selection is fine for now (pycodestyle E/W + pyflakes F).
# Future: enable I (isort), B (flake8-bugbear), UP (pyupgrade) once codebase
# is stabilized.

[lint.per-file-ignores]
# Standalone scripts call django.setup() before importing models —
# that is the documented Django pattern and intentionally violates E402.
"check_batch.py" = ["E402"]
"fix_batch.py" = ["E402"]
